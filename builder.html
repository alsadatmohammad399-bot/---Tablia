<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طبلية - ابنِ مطعمك</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>body{font-family:Cairo}</style>
</head>
<body class="bg-[#0a0a0a] text-white">
<div class="max-w-6xl mx-auto p-4 flex justify-between items-center border-b border-white/10">
<div class="flex gap-2 items-center"><div class="bg-[#FFD700] text-black w-10 h-10 rounded-full flex items-center justify-center font-black">ط</div><b>طبلية BUILDER</b></div>
<a href="index.html" class="text-xs bg-white/10 px-3 py-1 rounded-full">رجوع</a>
</div>
<div class="max-w-6xl mx-auto p-4 grid md:grid-cols-2 gap-6 mt-4">
<div class="bg-[#141414] p-6 rounded-[24px] border border-white/10">
<h2 class="font-black text-xl mb-4">1- بيانات مطعمك</h2>
<input id="r-name" placeholder="اسم المطعم - مثلا: بازوكا" class="w-full bg-black border border-white/20 p-4 rounded-xl mb-3">
<input id="r-color1" type="color" value="#FFD700" class="h-12 w-full rounded-xl mb-3">
<textarea id="r-menu-text" placeholder="اكتب المنيو:
كباب ضاني 1100
كفتة 650
شيش طاووق 380" class="w-full bg-black border border-white/20 p-4 rounded-xl h-32 text-sm"></textarea>
<button onclick="build()" class="w-full bg-[#FFD700] text-black py-4 rounded-xl mt-4 font-black">شوف المعاينة 👁️</button>
</div>
<div>
<h2 class="font-black text-xl mb-4">2- اختار ستايلك</h2>
<div class="grid grid-cols-2 gap-3">
<div onclick="sel('bazooka')" id="s-bazooka" class="cursor-pointer bg-[#141414] p-3 rounded-[20px] border-2 border-[#FFD700]"><div class="bg-black rounded-xl h-24"></div><p class="font-black mt-2 text-sm">🔥 بازوكا</p></div>
<div onclick="sel('sultan')" id="s-sultan" class="cursor-pointer bg-[#141414] p-3 rounded-[20px] border-2 border-transparent"><div class="bg-gradient-to-r from-orange-600 to-red-600 rounded-xl h-24"></div><p class="font-black mt-2 text-sm">👑 السلطان</p></div>
<div onclick="sel('tablia')" id="s-tablia" class="cursor-pointer bg-[#141414] p-3 rounded-[20px] border-2 border-transparent"><div class="bg-[#0f0f0f] border border-[#FFD700]/30 rounded-xl h-24"></div><p class="font-black mt-2 text-sm">⭐ طبلية - ستايلك</p></div>
<div onclick="sel('classic')" id="s-classic" class="cursor-pointer bg-[#141414] p-3 rounded-[20px] border-2 border-transparent"><div class="bg-white rounded-xl h-24"></div><p class="font-black mt-2 text-sm text-white">🤍 كلاسيك</p></div>
</div>
<div id="prev" class="mt-6 bg-black rounded-[24px] p-2 border border-white/10 hidden"><div id="frame" class="bg-white rounded-[20px] h-[400px] overflow-auto p-2 text-black text-sm"></div><button onclick="publish()" class="w-full bg-white text-black py-4 rounded-xl mt-3 font-black">🚀 انسخ رابط موقعك</button></div>
</div>
</div>
<script>
let style='bazooka', items=[];
function sel(s){style=s; document.querySelectorAll('[id^=s-]').forEach(e=>e.classList.remove('border-[#FFD700]')); document.getElementById('s-'+s).classList.add('border-[#FFD700]'); build();}
function build(){const name=document.getElementById('r-name').value||'مطعمك'; let t=document.getElementById('r-menu-text').value.trim(); if(t){items=t.split('\n').map(l=>{const m=l.match(/(.+?)\s+(\d+)/); return m?{n:m[1].trim(),p:parseInt(m[2])}:null}).filter(Boolean);} if(items.length==0) items=[{n:'وجبة تجريبية',p:250}]; document.getElementById('prev').classList.remove('hidden'); const f=document.getElementById('frame'); if(style=='bazooka') f.innerHTML=`<div class="bg-black text-white p-2 rounded font-black">${name} - BAZOOKA</div>${items.map(i=>`<div class="bg-white border p-2 rounded-xl mt-2 flex justify-between"><span>${i.n}</span><b>${i.p}ج</b></div>`).join('')}`; if(style=='sultan') f.innerHTML=`<div class="bg-gradient-to-r from-orange-500 to-red-600 p-2 rounded text-white font-black">${name}</div>${items.map(i=>`<div class="border p-2 rounded-xl mt-2 flex justify-between"><span>${i.n}</span><b class="text-orange-600">${i.p}ج</b></div>`).join('')}`; if(style=='tablia') f.innerHTML=`<div class="bg-black text-[#FFD700] p-3 rounded-xl font-black">⭐ ${name} - TABLIA</div>${items.map(i=>`<div class="bg-[#111] text-white border border-[#FFD700]/20 p-2 rounded-xl mt-2 flex justify-between"><span>${i.n}</span><b class="text-[#FFD700]">${i.p}ج</b></div>`).join('')}`; if(style=='classic') f.innerHTML=`<div class="p-2 font-black border-b">${name}</div>${items.map(i=>`<div class="flex justify-between p-2 border-b"><span>${i.n}</span><span>${i.p}ج</span></div>`).join('')}`;}
function publish(){const name=document.getElementById('r-name').value||'myrestaurant'; const slug=name.replace(/\s+/g,'-'); const link=`https://alsadat.github.io/Tablia/template.html?name=${slug}&style=${style}`; navigator.clipboard.writeText(link); alert('لينك موقعك اتنسخ 🔥\n'+link);}
</script>
</body>
</html>
