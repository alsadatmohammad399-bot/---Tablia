<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="t-title">طبلية</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@900&display=swap" rel="stylesheet">
<style>body{font-family:Cairo}</style>
</head>
<body id="body" class="bg-black">
<div id="app" class="min-h-screen"></div>
<script>
const p=new URLSearchParams(location.search);
const name=p.get('name')||'مطعم طبلية';
const style=p.get('style')||'tablia';
document.getElementById('t-title').innerText=name;
const app=document.getElementById('app');
const menu=[{n:'كباب ضاني 400جم',p:1100},{n:'كفتة الحاتي',p:650},{n:'شيش طاووق',p:380}];
if(style=='bazooka'){app.innerHTML=`<div class="bg-black text-white p-6"><h1 class="text-4xl font-black text-[#FFD700]">${name.toUpperCase()}</h1></div><div class="p-4 grid gap-3">${menu.map(i=>`<div class="bg-white p-4 rounded-2xl flex justify-between font-black"><span>${i.n}</span><span class="bg-black text-white px-3 rounded-full">${i.p}ج</span></div>`).join('')}</div>`}
else if(style=='sultan'){app.innerHTML=`<div class="bg-gradient-to-br from-orange-600 to-red-600 text-white p-8"><h1 class="text-4xl font-black">${name}</h1><p class="opacity-80">أصل الأكل الشرقي</p></div><div class="p-4">${menu.map(i=>`<div class="bg-white p-4 rounded-2xl flex justify-between mt-3"><span>${i.n}</span><b class="text-orange-600">${i.p}ج</b></div>`).join('')}</div>`; document.getElementById('body').className='bg-orange-50'}
else if(style=='tablia'){app.innerHTML=`<div class="p-6 flex justify-between"><div><h1 class="text-3xl font-black text-white">⭐ ${name}</h1><p class="text-[#FFD700] text-sm">POWERED BY TABLIA</p></div><div class="bg-[#FFD700] w-10 h-10 rounded-full flex items-center justify-center text-black font-black">ط</div></div><div class="p-4 grid gap-3">${menu.map(i=>`<div class="bg-[#161616] border border-[#FFD700]/20 p-4 rounded-2xl flex justify-between"><span class="text-white font-bold">${i.n}</span><span class="text-[#FFD700] font-black">${i.p}ج</span></div>`).join('')}</div>`}
else{app.innerHTML=`<div class="bg-white p-6 text-center"><h1 class="text-3xl font-black">${name}</h1></div><div class="p-4">${menu.map(i=>`<div class="flex justify-between p-4 border-b"><span>${i.n}</span><span>${i.p}ج</span></div>`).join('')}</div>`; document.getElementById('body').className='bg-white text-black'}
</script>
</body>
</html>
